<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>3D Gaussian Splats - Shadow Mapping Test with GUI</title>
  <script type="text/javascript" src="js/util.js"></script>
  <script type="importmap">
    {
        "imports": {
            "three": "./lib/three.module.js",
            "@mkkellogg/gaussian-splats-3d": "./lib/gaussian-splats-3d.module.js",
            "three/addons/": "./lib/"
        }
    }
  </script>
  <style>

    body {
      background-color: #222222;
      height: 100vh;
      margin: 0px;
      font-family: Arial, sans-serif;
      color: white;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 5px;
      z-index: 1000;
      max-width: 300px;
    }

    #info h3 {
      margin-top: 0;
    }

    #info button {
      margin: 5px 0;
      padding: 8px 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    #info button:hover {
      background-color: #45a049;
    }

    #info .status {
      margin: 5px 0;
      font-size: 12px;
    }

  </style>

</head>

<body>
  <div id="info">
    <h3>Shadow Mapping Test</h3>
    <div class="status">Shadow Enabled: <span id="shadowStatus">NO</span></div>
    <div class="status">PCSS Enabled: <span id="pcssStatus">NO</span></div>
    <button id="toggleShadows">Enable Shadows</button>
    <button id="togglePCSS">Enable PCSS</button>
    <p style="font-size: 11px; margin-top: 10px;">
      Use the GUI controls to adjust shadow light direction, and cup position/scale. The DirectionalLight follows the shadow light direction.
    </p>
  </div>

  <script type="module">
    import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';
    import * as THREE from 'three';
    import { OBJLoader } from 'three/addons/OBJLoader.js';
    import { GUI } from 'three/addons/lil-gui.module.min.js';

    let viewer;
    let shadowsEnabled = false;
    let pcssEnabled = false;
    let cupMesh = null;
    let directionalLight = null;
    let gui = null;
    
    // Shadow light parameters
    const shadowParams = {
      lightDirX: 0.5,
      lightDirY: -1.0,
      lightDirZ: 0.5
    };
    
    // Cup parameters
    const cupParams = {
      posX: 0,
      posY: 1.5,
      posZ: 0,
      scale: 1.0
    };

    function setupThreeScene() {
      const threeScene = new THREE.Scene();
      
      // Add ambient light for overall illumination
      const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
      threeScene.add(ambientLight);
      
      // Add directional light that matches shadow light direction
      directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
      updateDirectionalLight();
      threeScene.add(directionalLight);

      // Load the cup OBJ model
      const objLoader = new OBJLoader();
      objLoader.load(
        getRootPath() + 'assets/obj/cup.obj',
        function(object) {
          // Set up material with proper lighting support
          object.traverse(function(child) {
            if (child.isMesh) {
              // Use MeshStandardMaterial for realistic lighting
              child.material = new THREE.MeshStandardMaterial({
                color: 0xff6644,
                roughness: 0.5,
                metalness: 0.2
              });
            }
          });
          
          cupMesh = object;
          updateCupTransform();
          threeScene.add(cupMesh);
          console.log('Cup OBJ loaded successfully');
        },
        function(xhr) {
          console.log((xhr.loaded / xhr.total * 100) + '% loaded');
        },
        function(error) {
          console.error('Error loading OBJ:', error);
          // Create a fallback cube if OBJ fails to load
          const fallbackGeometry = new THREE.BoxGeometry(1, 2, 1);
          const fallbackMaterial = new THREE.MeshStandardMaterial({
            color: 0xff6644,
            roughness: 0.5,
            metalness: 0.2
          });
          cupMesh = new THREE.Mesh(fallbackGeometry, fallbackMaterial);
          updateCupTransform();
          threeScene.add(cupMesh);
          console.log('Using fallback cube geometry');
        }
      );

      return threeScene;
    }
    
    function updateDirectionalLight() {
      if (directionalLight) {
        // Normalize the direction vector
        const length = Math.sqrt(
          shadowParams.lightDirX * shadowParams.lightDirX +
          shadowParams.lightDirY * shadowParams.lightDirY +
          shadowParams.lightDirZ * shadowParams.lightDirZ
        );
        directionalLight.position.set(
          -shadowParams.lightDirX / length * 10,
          -shadowParams.lightDirY / length * 10,
          -shadowParams.lightDirZ / length * 10
        );
        directionalLight.lookAt(0, 0, 0);
      }
    }
    
    function updateCupTransform() {
      if (cupMesh) {
        cupMesh.position.set(cupParams.posX, cupParams.posY, cupParams.posZ);
        cupMesh.scale.set(cupParams.scale, cupParams.scale, cupParams.scale);
      }
    }
    
    function createGUI() {
      if (gui) gui.destroy();
      
      gui = new GUI();
      gui.title('Shadow & Cup Controls');
      
      // Shadow Light Direction folder
      const lightFolder = gui.addFolder('Shadow Light Direction');
      lightFolder.add(shadowParams, 'lightDirX', -2, 2, 0.1)
        .name('Direction X')
        .onChange(() => {
          updateDirectionalLight();
          recreateViewer();
        });
      lightFolder.add(shadowParams, 'lightDirY', -2, 2, 0.1)
        .name('Direction Y')
        .onChange(() => {
          updateDirectionalLight();
          recreateViewer();
        });
      lightFolder.add(shadowParams, 'lightDirZ', -2, 2, 0.1)
        .name('Direction Z')
        .onChange(() => {
          updateDirectionalLight();
          recreateViewer();
        });
      lightFolder.open();
      
      // Cup Transform folder
      const cupFolder = gui.addFolder('Cup Transform');
      cupFolder.add(cupParams, 'posX', -5, 5, 0.1)
        .name('Position X')
        .onChange(updateCupTransform);
      cupFolder.add(cupParams, 'posY', -5, 5, 0.1)
        .name('Position Y')
        .onChange(updateCupTransform);
      cupFolder.add(cupParams, 'posZ', -5, 5, 0.1)
        .name('Position Z')
        .onChange(updateCupTransform);
      cupFolder.add(cupParams, 'scale', 0.1, 3, 0.1)
        .name('Scale')
        .onChange(updateCupTransform);
      cupFolder.open();
    }

    async function init() {
      // Create the THREE.js scene with meshes
      const threeScene = setupThreeScene();

      // Create GUI controls
      createGUI();

      // Create viewer with shadow mapping enabled
      viewer = new GaussianSplats3D.Viewer({
        'cameraUp': [0, -1, 0],
        'initialCameraPosition': [-1, -5, 6],
        'initialCameraLookAt': [0, 0, 0],
        'threeScene': threeScene,
        'enableShadowsOnSplats': shadowsEnabled,
        'enablePCSSOnSplats': pcssEnabled,
        'shadowMapResolution': 1024,
        'shadowBias': 0.0005,
        'shadowLightDirection': [shadowParams.lightDirX, shadowParams.lightDirY, shadowParams.lightDirZ],
        'shadowOrthoSize': 10,
        'shadowNearFar': [0.1, 50],
        'shadowLightRadius': 0.02
      });

      // Try to load a splat scene with timeout
      let splatLoaded = false;
      try {
        // Add a timeout to handle missing files
        const loadPromise = viewer.addSplatScene(getRootPath() + 'assets/data/bonsai/bonsai-7k.ksplat', {
          'position': [0, 0, 0],
          'rotation': [0, 0, 0, 1],
          'scale': [1.5, 1.5, 1.5]
        });
        
        const timeoutPromise = new Promise((_, reject) => 
          setTimeout(() => reject(new Error('Loading timeout - file may not exist')), 5000)
        );
        
        await Promise.race([loadPromise, timeoutPromise]);
        console.log('Splat scene loaded successfully');
        splatLoaded = true;
      } catch (error) {
        console.error('Error loading splat scene:', error);
        // Show error message to user
        const errorDiv = document.createElement('div');
        errorDiv.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,0,0,0.8); color: white; padding: 20px; border-radius: 10px; text-align: center; z-index: 10000; max-width: 500px;';
        errorDiv.innerHTML = `
          <h2>⚠️ Data File Missing</h2>
          <p>The splat scene file could not be loaded.</p>
          <p style="font-size: 14px; margin-top: 10px;">To see splats, please download the demo data from:</p>
          <p style="font-size: 12px;"><a href="https://projects.markkellogg.org/downloads/gaussian_splat_data.zip" style="color: #ffff00;">https://projects.markkellogg.org/downloads/gaussian_splat_data.zip</a></p>
          <p style="font-size: 13px; margin-top: 5px;">Extract it to: <code style="background: rgba(0,0,0,0.3); padding: 2px 5px; border-radius: 3px;">build/demo/assets/data/</code></p>
          <p style="font-size: 13px; margin-top: 15px; color: #ffff88;">✓ You should still see the cup model and lights working.</p>
          <button onclick="this.parentElement.remove()" style="margin-top: 15px; padding: 8px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">Close</button>
        `;
        document.body.appendChild(errorDiv);
      }
      
      // Always start the viewer to show Three.js meshes even without splat data
      viewer.start();
    }
    
    function recreateViewer() {
      if (viewer) {
        viewer.dispose().then(() => {
          init();
        });
      }
    }

    // Toggle shadow state
    function toggleShadows() {
      shadowsEnabled = !shadowsEnabled;
      document.getElementById('shadowStatus').textContent = shadowsEnabled ? 'YES' : 'NO';
      document.getElementById('toggleShadows').textContent = shadowsEnabled ? 'Disable Shadows' : 'Enable Shadows';

      // Recreate viewer with new settings
      recreateViewer();
    }

    function togglePCSS() {
      pcssEnabled = !pcssEnabled;
      document.getElementById('pcssStatus').textContent = pcssEnabled ? 'YES' : 'NO';
      document.getElementById('togglePCSS').textContent = pcssEnabled ? 'Disable PCSS' : 'Enable PCSS';

      // Recreate viewer with new settings
      recreateViewer();
    }

    // Setup event listeners
    document.getElementById('toggleShadows').addEventListener('click', toggleShadows);
    document.getElementById('togglePCSS').addEventListener('click', togglePCSS);

    // Initialize the demo
    init();

  </script>

</body>

</html>
